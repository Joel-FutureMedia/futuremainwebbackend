# Server
server.port=8980
spring.application.name=futuremediabackend

# PostgreSQL (port 6432 = PgBouncer — disable server prepared statements)
spring.datasource.url=jdbc:postgresql://84.8.131.140:5432/future?prepareThreshold=0&preferQueryMode=simple
spring.datasource.username=joelchipoya
spring.datasource.password=Kalimbwejoel
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — safe with PgBouncer transaction pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.open-in-view=false

# Multipart Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=250MB

# File Upload Location (legacy local fallback — files are stored in MinIO, not PostgreSQL)
app.upload.dir=uploads

# MinIO (self-hosted S3) – all videos, music, covers, profile pics, logos, CVs, documents live here
